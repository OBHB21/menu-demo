<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蓮德品素天地 - 線上點餐</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: "Microsoft JhengHei", sans-serif; }
        .menu-card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .cart-sticky { position: fixed; bottom: 20px; right: 20px; z-index: 1000; }
    </style>
</head>
<body>

<div class="container py-4" style="max-width: 600px;">
    <div class="text-center mb-4">
        <h1 class="fw-bold text-success">蓮德品素天地</h1>
        <p class="text-muted">台北市中正區寧波西街82號</p>
        <div class="alert alert-info">目前桌號：<strong id="table-display">偵測中...</strong></div>
    </div>

    <h3 class="border-start border-4 border-success ps-2 mb-3">法式焗烤系列 $250</h3>
    
    <div class="card menu-card mb-3">
        <div class="card-body">
            <h5 class="card-title fw-bold">南瓜焗飯 / 麵</h5>
            <p class="card-text text-muted small">請選擇主食與是否升級套餐</p>
            
            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">1. 選擇主食：</label><br>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="main-type" id="main-rice" value="飯" checked>
                    <label class="form-check-label" for="main-rice">飯</label>
                </div>
                <div class="form-check form-check-inline">
                    <input class="form-check-input" type="radio" name="main-type" id="main-noodle" value="麵">
                    <label class="form-check-label" for="main-noodle">麵</label>
                </div>
            </div>

            <div class="mb-3">
                <label class="form-label small fw-bold text-secondary">2. 升級套餐：</label><br>
                <div class="form-check mb-1">
                    <input class="form-check-input" type="radio" name="combo" id="combo-none" value="0" checked>
                    <label class="form-check-label" for="combo-none">單點 ($250)</label>
                </div>
                <div class="form-check mb-1">
                    <input class="form-check-input" type="radio" name="combo" id="combo-b" value="80">
                    <label class="form-check-label" for="combo-b">升級 B 套餐 (+$80)</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="radio" name="combo" id="combo-a" value="180">
                    <label class="form-check-label" for="combo-a">升級 A 套餐 (+$180)</label>
                </div>
            </div>

            <button class="btn btn-success w-100 mt-2" onclick="addToCart('南瓜焗烤')">加入購物車</button>
        </div>
    </div>

    <div class="card menu-card mt-4">
        <div class="card-body">
            <h4 class="fw-bold mb-3">我的購物車</h4>
            <div id="cart-items" class="text-muted small mb-3">購物車是空的</div>
            <h5 class="fw-bold text-end">總計: $<span id="cart-total">0</span></h5>
            <button id="submit-btn" class="btn btn-danger w-100 btn-lg mt-3" disabled onclick="sendOrderToServer()">確認送出訂單</button>
        </div>
    </div>
</div>

<script>
    // 1. 自動從網址偵測桌號 (例如網址後面加上 ?table=5)
    const urlParams = new URLSearchParams(window.location.search);
    const tableNo = urlParams.get('table') || "未偵測到桌號";
    document.getElementById('table-display').innerText = tableNo;

    // 2. 購物車狀態暫存
    let cart = null;

    function addToCart(itemName) {
        // 抓取當下的客製化選擇
        const mainType = document.querySelector('input[name="main-type"]:checked').value;
        const comboPrice = parseInt(document.querySelector('input[name="combo"]:checked').value);
        
        let comboText = "單點";
        if(comboPrice === 80) comboText = "B套餐";
        if(comboPrice === 180) comboText = "A套餐";

        const itemTotal = 250 + comboPrice;

        // 組合成明細文字
        cart = {
            detail: `${itemName}(${mainType}) + [${comboText}]`,
            price: itemTotal
        };

        // 更新網頁上的購物車畫面
        document.getElementById('cart-items').innerHTML = `<div class="d-flex justify-content-between"><span>${cart.detail}</span><span class="fw-bold">$${cart.price}</span></div>`;
        document.getElementById('cart-total').innerText = cart.price;
        document.getElementById('submit-btn').disabled = false;
    }

    // 3. 將訂單發送到 Google 試算表
    function sendOrderToServer() {
        if (!cart) return;
        
        const submitBtn = document.getElementById('submit-btn');
        submitBtn.disabled = true;
        submitBtn.innerText = "訂單傳送中...";

        // 準備要送給 Google Sheets 的資料包
        const orderData = {
            order_id: "ORD-" + Date.now().toString().slice(-6), // 隨機生成後六碼單號
            table_no: tableNo,
            items_detail: cart.detail,
            total_price: cart.price
        };

        // ➔➔➔ 這裡已經自動換成你的網址了 ➔➔➔
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwOp4vY6kAR38iKnaRipBYBtO6iaHGIz3LTnh97MsOU8EuZjOk8k2v8C-sTZNSfgrcZ8g/exec"; 

        fetch(GAS_URL, {
            method: 'POST',
            body: JSON.stringify(orderData)
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === "success") {
                alert("🎉 點餐成功！廚房已收到您的訂單。");
                // 清空購物車
                cart = null;
                document.getElementById('cart-items').innerText = "購物車是空的";
                document.getElementById('cart-total').innerText = "0";
                submitBtn.innerText = "確認送出訂單";
            } else {
                alert("系統錯誤：" + data.message);
                submitBtn.disabled = false;
                submitBtn.innerText = "確認送出訂單";
            }
        })
        .catch(error => {
            alert("網路連線失敗，請稍後再試！");
            submitBtn.disabled = false;
            submitBtn.innerText = "確認送出訂單";
        });
    }
</script>
</body>
</html>
